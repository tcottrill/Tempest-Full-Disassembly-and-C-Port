; tempest_win.ini - settings for tempest_emu.exe.
; The file name is the Windows backend's (c_src\platform\windows\plat_win.c,
; shared unchanged with tempest_win.exe); this copy lives next to
; tempest_emu.exe in emu_src\, so the two programs never share settings, log or
; EAROM image.  Every key means what it means in ..\c_src\tempest_win.ini -
; see the comments there; the exe writes back the value that took effect.
; The only key of the emulator's own is [main] roms.

[dips]
coinage=1_coin_1_play
right_coin=x1
left_coin=x1
bonus_coins=none
minimum_credits=1
language=english
bonus_life=20000
lives=3
difficulty=medium1
rating=1_3_5_7_9
cabinet=upright
special_option=off

[main]
vsync=0
fps_lock=0.000000
vg_window=cycles
test_switch=0
watchdog_cycles=1134000.000000
refresh_hz=0.000000
; roms: the MAME Tempest zip to load (tempest, tempest1r, tempest3, tempest2 or
; tempest1 layout).  Empty = roms\tempest.zip beside the exe, then
; ..\roms\tempest.zip.  A relative path is relative to the current directory.
; --roms FILE on the command line wins over this key.
roms=

[vector]
phosphor_ms=0.000000
linewidth=2.000000
line_smoothing=1.000000
gain=0
corner_strength=1.000000
fire_point_size=10.000000

[video]
rotate_sign=1
honour_flip=1

[input]
mouse_sensitivity=0.500000
key_spin_rate=180.000000
joy_spin_rate=180.000000
invert_spin=0
mouse_capture=1

[joystick]
deadzone=19

[sound]
pokey_volume=100
latency_blocks=6
