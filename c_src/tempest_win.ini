; tempest_win.ini - settings for tempest_win.exe (Tempest C port, M8 part 2).
; Lives next to the exe.  The exe reads every key at start and writes back the
; value that took effect (an unknown word falls back to the default), so a
; deleted key reappears with its default.  See NOTES_m8.md "Part 2".
;
; Keys: mouse X / Left / Right = spinner, Left Ctrl / Space / left mouse = fire,
; Left Alt / right mouse = superzapper, 1 / 2 = start, 5 / 6 / 7 = coin L / C / R,
; F2 = TEST switch on/off (a toggle, like the board's: in the game -> options
; and bookkeeping (DSPSYS: FIRE+ZAP = self test, FIRE+START1 = zero times,
; FIRE+START2 = zero high scores, chosen with the spinner); at power-on -> the
; ROM's self test; off in the self test -> watchdog reboot into the game),
; F1 = diagnostic step (hold: next self-test screen), F3 = slam (steps the
; self-test screens too), [ / ] mouse sensitivity, Shift+[ / Shift+] key spin
; rate, F8 mouse capture, Alt+Enter fullscreen, Esc quit.  NOTES_m9.md "B5".

[dips]
; Option switches, as the MAME/AAE tempest driver names them; the defaults are
; all switches off (= AAE/MAME defaults = the refrun oracle's settings).
; --- N13 (INOP0 $0D00) ---
; coinage: 1_coin_1_play | 2_coins_1_play | 1_coin_2_plays | free_play
coinage=1_coin_1_play
; right_coin: right coin mech multiplier x1 | x4 | x5 | x6
right_coin=x1
; left_coin: left coin mech multiplier x1 | x2
left_coin=x1
; bonus_coins: none | 1_each_5 | 1_each_4 | 1_each_3 | 2_each_4 | 1_each_2 | freeze
;   (freeze + free_play freezes the game: EXSTAT's (N13 & $83) == $82 test)
bonus_coins=none
; --- L12 (INOP1 $0E00) ---
; minimum_credits: credits needed to start: 1 | 2
minimum_credits=1
; language: english | french | german | spanish
language=english
; bonus_life: bonus life every 10000 | 20000 | 30000 | 40000 | 50000 | 60000 | 70000 | none
bonus_life=20000
; lives: lives per game 2 | 3 | 4 | 5
lives=3
; --- POKEY 2 pot lines b0-2 ---
; difficulty: easy | medium1 | medium2 | hard
difficulty=medium1
; rating: RATE YOURSELF choices: 1_3_5_7_9 | tied_to_high_score
rating=1_3_5_7_9
; --- POKEY 1 pot lines b4-5 ---
; cabinet: upright | cocktail (cocktail turns the picture 180 degrees for player 2)
cabinet=upright
; special_option: off | on (the ROM's MOPTI4 bit)
special_option=off

[main]
; vsync: 0 = off (default): each ~27 Hz game frame is swapped the moment the
; game finishes it, never blocking the game clock.  1 = on: a frame is swapped
; at the display's refresh, but only when that refresh comes before the next
; game IRQ is due (otherwise it waits for a later one), so pacing is unaffected.
; 2 = adaptive vsync where the driver has it.
vsync=0
; refresh_hz: 0 = ask Windows for the monitor's rate (vsync=1 timing, phosphor redraws)
refresh_hz=0.000000
; fps_lock: the board's IRQ rate in Hz.  0 = the real board's 246.09 Hz
; (12.096 MHz / 4096 / 12, as MAME).  240 = AAE's Tempest rate (60 fps x 4
; IRQs), 2.5% slower.  Game speed, timers and sound tempo/pitch scale together.
fps_lock=0.000000
; test_switch: the TEST switch at power-on: 0 = open (the game), 1 = closed (the
; ROM's power-on self test; same as --test).  F2 toggles it at run time (not saved).
test_switch=0
; watchdog_cycles: hardware watchdog timeout in CPU cycles (1.512 MHz) without a
; kick; 1134000 = 0.75 s (AAE's, the refrun oracle's).  Only leaving the self test
; waits for it.
watchdog_cycles=1134000.000000

[vector]
; phosphor_ms: afterglow time constant in ms, 0 = off (the newest frame only)
phosphor_ms=0.000000
; linewidth: beam width in pixels at the default 720-wide window (scales with the picture)
linewidth=2.000000
; gain: 0..255 brightness lift added to every beam
gain=0
; line_smoothing: anti-aliasing feather in physical pixels
line_smoothing=1.000000
; corner_strength: round join size at corners, x half-width
corner_strength=1.000000
; fire_point_size: unused by Tempest (the renderer's shot sprites)
fire_point_size=10.000000

[video]
; rotate_sign: 1 = the cabinet's upright picture, -1 = turned 180 degrees
rotate_sign=1
; honour_flip: 1 = apply the ROM's OUT0 video-invert bits (cocktail player 2), 0 = ignore
honour_flip=1

[input]
; mouse_sensitivity: spinner counts per mouse mickey (mouse X is the spinner).
; Live: [ lowers / ] raises it by 10%; the value is shown in the title bar and
; saved here on exit.
mouse_sensitivity=0.500000
; key_spin_rate: spinner counts per second while Left/Right is held (default
; 180).  Live: Shift+[ / Shift+] by 10%, shown in the title, saved on exit.
key_spin_rate=180.000000
; joy_spin_rate: spinner counts per second at full joystick X deflection
joy_spin_rate=180.000000
; invert_spin: 0 = mouse/key right turns the claw clockwise (the knob's top
; moving right, MAME's reversed dial), 1 = counter-clockwise
invert_spin=0
; mouse_capture: 1 = hide the cursor and confine it to the window while it has
; focus (F8 toggles at run time), 0 = off
mouse_capture=1

[joystick]
; deadzone: radial deadzone of the main stick, 0..126
deadzone=19

[sound]
; pokey_volume: the two POKEYs' mixed output, 0..100 percent (0 = no audio device)
pokey_volume=100
; latency_blocks: audio blocks (~4 ms each) queued ahead of playback, 1..8;
; the margin that absorbs a vsynced swap holding up the game thread
latency_blocks=6
